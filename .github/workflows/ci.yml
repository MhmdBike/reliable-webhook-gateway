name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Test and Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify Module Dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run Unit Tests with Race Detector
        run: go test -v -race ./...

      - name: Compile Executables
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -v -o bin/server cmd/server/main.go
          CGO_ENABLED=0 go build -v -o bin/worker cmd/worker/main.go
          CGO_ENABLED=0 go build -v -o bin/mock_target cmd/mock_target/main.go
